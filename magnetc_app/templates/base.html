<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Magnet Search WebApp{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-logo">🎬</span>
          <span class="brand-title">Magnet Finder</span>
        </div>
        <div class="brand-tagline">Find high‑quality movie magnets quickly.</div>
      </header>

      <main class="app-main">
        {% block content %}{% endblock %}
      </main>

      <footer class="app-footer">
        <span>Built with Flask + Playwright</span>
      </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
